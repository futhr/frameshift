services:
  postgres:
    image: pgvector/pgvector@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    environment:
      POSTGRES_USER: frameshift_dev
      POSTGRES_PASSWORD: frameshift_local_only
      POSTGRES_DB: frameshift_platform_dev
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - platform_pgvector:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frameshift_dev -d frameshift_platform_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  platform_pgvector:
