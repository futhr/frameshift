global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - rules.yml
scrape_configs:
  - job_name: frameshift-platform
    metrics_path: /ops/metrics
    scrape_timeout: 5s
    sample_limit: 1000
    label_limit: 8
    body_size_limit: 256KB
    authorization:
      type: Bearer
      credentials_file: /run/secrets/frameshift-metrics-token
    static_configs:
      - targets: ["127.0.0.1:4080"]
